resources:
  jobs:
    sample_job:
      name: sample_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: task1
          notebook_task:
            notebook_path: ../src/jobs_demo_task1.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: task2
          depends_on:
            - task_key: task1
          notebook_task:
            notebook_path: ../src/jobs_demo_task2.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "4"