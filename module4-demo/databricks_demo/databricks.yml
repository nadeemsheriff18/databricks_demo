# This is a Declarative Automation Bundle definition for databricks_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_demo
  uuid: 7d07dfdf-9180-475c-9292-6b2d2531f691

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f21dce07-75d6.cloud.databricks.com
    variables:
      catalog: nadeem_catalog
      schema: ingestion_demo
  prod:
    mode: production
    workspace:
      host: https://dbc-f21dce07-75d6.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/nsheriff@psyncopate.com to make sure we only have a single copy.
      root_path: /Workspace/Users/nsheriff@psyncopate.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: nadeem_catalog
      schema: ingestion_demo
    permissions:
      - user_name: nsheriff@psyncopate.com
        level: CAN_MANAGE
